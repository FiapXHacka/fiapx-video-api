name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (tag in the comment); Dependabot keeps them updated.
jobs:
  test:
    name: Build, test & analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # secretless SonarQube Cloud analysis (OIDC), no SONAR_TOKEN secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs the history for blame and new code

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21 # the SonarScanner for .NET runs on Java

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      # Exchanges the job's GitHub OIDC token for a 30-minute token scoped to this repo's project
      # and exports it as SONAR_TOKEN for the next steps.
      - name: SonarQube Cloud auth (secretless)
        id: sonar
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2

      - name: Sonar begin
        run: >
          dotnet sonarscanner begin
          /k:"${{ steps.sonar.outputs.project-key }}"
          /o:"${{ steps.sonar.outputs.organization }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.cs.vscoveragexml.reportsPaths="**/TestResults/*.coverage.xml"
          /d:sonar.coverage.exclusions="**/Program.cs,**/Migrations/**,**/DesignTime*.cs"
          /d:sonar.cpd.exclusions="**/Migrations/**"

      - name: Build
        run: dotnet build FiapX.VideoApi.slnx -c Release --no-incremental

      # Microsoft.Testing.Platform runner (global.json); coverage in VS XML format, read by Sonar.
      # One command per project so each one writes its own coverage file.
      - name: Unit tests
        run: >
          dotnet test --project tests/FiapX.VideoApi.UnitTests -c Release --no-build
          --coverage --coverage-output-format xml --coverage-output unit.coverage.xml

      - name: Integration tests (Testcontainers)
        run: >
          dotnet test --project tests/FiapX.VideoApi.IntegrationTests -c Release --no-build
          --coverage --coverage-output-format xml --coverage-output integration.coverage.xml

      - name: Sonar end
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (push comes with the deploy workflow)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: fiapx-video-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
